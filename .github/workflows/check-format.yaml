name: Check Code Formatting 🛠️
on:
  workflow_call:
    inputs:
      baseRef:
        description: Optional base for contribution-branch formatting checks
        type: string
        default: ''
jobs:
  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: clang-format check 🐉
        id: clang-format
        uses: ./.github/actions/run-clang-format
        with:
          failCondition: error
          baseRef: ${{ inputs.baseRef }}

  gersemi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: gersemi Check 🎛️
        id: gersemi
        uses: ./.github/actions/run-gersemi
        with:
          failCondition: error
          baseRef: ${{ inputs.baseRef }}

  visca-profiles:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: VISCA command set layout check 📷
        run: python3 scripts/check-visca-profiles.py
      - name: ptz-probe tables check 🔭
        run: python3 scripts/ptz-probe/gen_tables.py --check

  module-boundaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Module boundary check 🧱
        run: python3 scripts/check-module-boundaries.py
